<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi Modern</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Pustaka Scanner Super Cepat -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
    <style>
        .bg-gradient-purple {
            background: linear-gradient(135deg, #6b21a8 0%, #4c1d95 100%);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-purple-50 min-h-screen text-gray-800 flex flex-col items-center p-4">

    <!-- Header / Judul -->
    <div class="max-w-xl w-full bg-gradient-purple text-white rounded-2xl shadow-xl p-6 mb-6 text-center animate-fade">
        <h1 class="text-3xl font-extrabold tracking-wide mb-1">ABSENSI SISWA</h1>
        <p class="text-purple-200 text-sm">Scan QR Code dengan cepat atau gunakan input manual</p>
    </div>

    <div class="max-w-xl w-full space-y-6">
        
        <!-- Pilihan Status Absen (Datang, Pulang, Sakit, Izin, Alfa) -->
        <div class="bg-white rounded-2xl shadow-lg p-4 animate-fade">
            <label class="block text-xs font-bold text-purple-900 uppercase tracking-wider mb-2">Pilih Mode / Status Absen:</label>
            <div class="grid grid-cols-5 gap-2">
                <button type="button" onclick="setStatus('Auto')" id="btn-Auto" class="status-btn col-span-1 py-2 text-xs font-bold rounded-xl border-2 border-purple-600 bg-purple-600 text-white transition shadow-sm">Auto</button>
                <button type="button" onclick="setStatus('Datang')" id="btn-Datang" class="status-btn col-span-1 py-2 text-xs font-bold rounded-xl border-2 border-purple-200 text-purple-700 hover:bg-purple-50 transition">Datang</button>
                <button type="button" onclick="setStatus('Pulang')" id="btn-Pulang" class="status-btn col-span-1 py-2 text-xs font-bold rounded-xl border-2 border-purple-200 text-purple-700 hover:bg-purple-50 transition">Pulang</button>
                <button type="button" onclick="setStatus('Sakit')" id="btn-Sakit" class="status-btn col-span-1 py-2 text-xs font-bold rounded-xl border-2 border-purple-200 text-purple-700 hover:bg-purple-50 transition">Sakit</button>
                <button type="button" onclick="setStatus('Izin')" id="btn-Izin" class="status-btn col-span-1 py-2 text-xs font-bold rounded-xl border-2 border-purple-200 text-purple-700 hover:bg-purple-50 transition">Izin</button>
            </div>
        </div>

        <!-- Kamera Scanner Box -->
        <div class="bg-white rounded-2xl shadow-lg p-5 animate-fade">
            <div class="flex justify-between items-center mb-3">
                <span class="font-bold text-sm text-purple-900 flex items-center gap-1">
                    <svg class="w-5 h-5 text-purple-600 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                    Kamera Scanner Aktif
                </span>
                <span id="scan-status-badge" class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-bold">Mode: Otomatis</span>
            </div>
            
            <div id="reader" class="w-full rounded-xl overflow-hidden border-4 border-purple-100 bg-gray-900" style="min-height: 250px;"></div>
        </div>

        <!-- Input Manual Alternatif -->
        <div class="bg-white rounded-2xl shadow-lg p-5 animate-fade">
            <label class="block text-xs font-bold text-purple-900 uppercase tracking-wider mb-2">Atau Ketik NIS Manual:</label>
            <div class="flex gap-2">
                <input type="text" id="manual-nis" placeholder="Ketik NIS lalu enter/klik kirim..." class="flex-1 border-2 border-purple-100 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-purple-600 transition">
                <button onclick="prosesManual()" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition shadow-md">Kirim</button>
            </div>
        </div>

        <!-- Kotak Notifikasi Hasil -->
        <div id="result-container" class="hidden p-4 rounded-2xl text-center font-bold text-sm shadow-md transition-all duration-300 animate-fade"></div>

        <!-- List Nama Siswa yang Sudah Absen Hari Ini -->
        <div class="bg-white rounded-2xl shadow-lg p-5 animate-fade mb-10">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-sm text-purple-900 uppercase tracking-wider">Daftar Masuk Hari Ini</h2>
                <span id="counter-hadir" class="bg-purple-100 text-purple-700 text-xs font-bold px-2.5 py-1 rounded-full">0 Siswa</span>
            </div>
            <div class="overflow-x-auto max-h-60 overflow-y-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-purple-50 text-purple-800 sticky topk">
                        <tr>
                            <th class="p-2.5 rounded-l-lg">Waktu</th>
                            <th class="p-2.5">Nama</th>
                            <th class="p-2.5">Kelas</th>
                            <th class="p-2.5 rounded-r-lg text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="list-absen-body" class="divide-y divide-purple-50">
                        <tr>
                            <td colspan="4" class="text-center text-gray-400 py-4">Belum ada data absensi hari ini.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP TERBARU ANDA
        // ==========================================
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxZtDi4uDpPSZqQLV14z9Y_eHDMN4WPAGJrM6CXOaUPdBeFXR1oRhDWzgC5TclvUGhfDQ/exec";

        let currentStatus = "Auto";
        let isProcessing = false;
        let listSiswaHariIni = [];

        function setStatus(status) {
            currentStatus = status;
            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.className = "status-btn col-span-1 py-2 text-xs font-bold rounded-xl border-2 border-purple-200 text-purple-700 hover:bg-purple-50 transition";
            });
            const activeBtn = document.getElementById(`btn-${status}`);
            activeBtn.className = "status-btn col-span-1 py-2 text-xs font-bold rounded-xl border-2 border-purple-600 bg-purple-600 text-white transition shadow-sm";
            
            document.getElementById('scan-status-badge').innerText = `Mode: ${status}`;
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;
            kirimKeGoogleSheets(decodedText);
        }

        function prosesManual() {
            const nis = document.getElementById('manual-nis').value.trim();
            if (!nis) {
                alert("Masukkan NIS terlebih dahulu!");
                return;
            }
            if (isProcessing) return;
            isProcessing = true;
            document.getElementById('manual-nis').value = "";
            kirimKeGoogleSheets(nis);
        }

        // Enter key support untuk input manual
        document.getElementById('manual-nis').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                prosesManual();
            }
        });

        function kirimKeGoogleSheets(nisOrData) {
            const resultDiv = document.getElementById('result-container');
            resultDiv.className = "p-4 rounded-2xl text-center font-bold text-sm shadow-md bg-purple-100 text-purple-800 animate-fade";
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = "Memproses absensi... ⚡";

            let targetUrl = `${URL_APPS_SCRIPT}?dataQR=${encodeURIComponent(nisOrData)}`;
            if (currentStatus !== "Auto") {
                targetUrl += `&status=${encodeURIComponent(currentStatus)}`;
            }

            fetch(targetUrl)
                .then(response => response.text())
                .then(resText => {
                    let badgeColor = "bg-green-100 text-green-800 border border-green-200";
                    let prefixText = "BERHASIL: ";

                    if (resText.startsWith("DOUBLE")) {
                        badgeColor = "bg-yellow-100 text-yellow-800 border border-yellow-200";
                        prefixText = "PERHATIAN: ";
                    } else if (resText.startsWith("ERROR")) {
                        badgeColor = "bg-red-100 text-red-800 border border-red-200";
                        prefixText = "GAGAL: ";
                    }

                    resultDiv.className = `p-4 rounded-2xl text-center font-bold text-sm shadow-md ${badgeColor} animate-fade`;
                    resultDiv.innerHTML = resText.replace("SUKSES|", prefixText).replace("DOUBLE|", prefixText).replace("ERROR|", prefixText);

                    // Jika sukses, tambahkan ke list riwayat bawah
                    if (resText.startsWith("SUKSES")) {
                        tambahKeListRiwayat(resText);
                    }

                    // Jeda super cepat 1.5 detik agar guru bisa langsung scan murid berikutnya
                    setTimeout(() => {
                        isProcessing = false;
                        resultDiv.classList.add('hidden');
                    }, 1800);
                })
                .catch(err => {
                    resultDiv.className = "p-4 rounded-2xl text-center font-bold text-sm shadow-md bg-red-100 text-red-800 animate-fade";
                    resultDiv.innerHTML = "Gagal terhubung ke jaringan!";
                    setTimeout(() => {
                        isProcessing = false;
                    }, 2000);
                });
        }

        function tambahKeListRiwayat(responseFromServer) {
            // Format respon: SUKSES|Datang: Nama Siswa (Kelas)
            const waktuSekarang = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            listSiswaHariIni.unshift({
                waktu: waktuSekarang,
                pesan: responseFromServer.replace("SUKSES|", "")
            });

            renderListRiwayat();
        }

        function renderListRiwayat() {
            const tbody = document.getElementById('list-absen-body');
            document.getElementById('counter-hadir').innerText = `${listSiswaHariIni.length} Siswa`;

            if (listSiswaHariIni.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-gray-400 py-4">Belum ada data absensi hari ini.</td></tr>`;
                return;
            }

            let html = "";
            listSiswaHariIni.forEach(item => {
                // Pisahkan teks untuk tabel
                html += `
                    <tr class="hover:bg-purple-50 transition">
                        <td class="p-2.5 font-medium text-purple-900">${item.waktu}</td>
                        <td class="p-2.5 font-bold text-gray-800" colspan="2">${item.pesan}</td>
                        <td class="p-2.5 text-center">
                            <span class="px-2 py-0.5 bg-green-100 text-green-700 rounded-full font-bold text-[10px]">Tercatat</span>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // Inisialisasi Scanner Berkecepatan Tinggi
        document.addEventListener("DOMContentLoaded", function () {
            const html5QrCode = new Html5Qrcode("reader");
            
            // Konfigurasi kecepatan tinggi (fps tinggi & jeda minimal)
            const config = { 
                fps: 20, 
                qrbox: { width: 230, height: 230 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess
            ).catch(err => {
                console.error("Gagal kamera:", err);
                document.getElementById('reader').innerHTML = "<div class='text-white p-6 text-center text-xs'>Kamera tidak aktif. Gunakan fitur Ketik Manual di atas.</div>";
            });
        });
    </script>
</body>
</html>
