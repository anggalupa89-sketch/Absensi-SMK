<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi QR Code</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Pustaka Scanner QR -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Absensi Siswa</h1>
        <p class="text-sm text-center text-gray-500 mb-4">HP dengan banyak lensa kamera? Pilih manual di bawah.</p>

        <!-- Tombol 1: Minta Izin & Cari Daftar Kamera -->
        <div id="init-container" class="mb-4">
            <button onclick="cariKamera()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition text-sm">
                1. Beri Izin & Cari Kamera
            </button>
        </div>

        <!-- Tombol 2: Pilih Lensa (Muncuk Setelah Tombol 1 Ditekan) -->
        <div id="camera-selection-container" class="mb-4 hidden p-3 bg-blue-50 rounded-lg border border-blue-100">
            <label class="block text-xs font-semibold text-blue-800 mb-1">Daftar Lensa Kamera Terdeteksi:</label>
            <select id="camera-select" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 mb-2">
            </select>
            <button onclick="mulaiKameraPilihan()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-xl shadow-md transition text-sm">
                2. Nyalakan Kamera Terpilih
            </button>
        </div>

        <!-- Area Kamera Scanner -->
        <div id="reader" class="w-full rounded-lg overflow-hidden border-2 border-dashed border-gray-300 mb-4 bg-black flex items-center justify-center text-gray-400 text-sm" style="min-height: 250px;">
            Kamera belum aktif
        </div>

        <!-- Status Hasil Scan -->
        <div id="result-container" class="hidden p-4 rounded-lg text-center font-medium mb-4"></div>

        <!-- Input Manual Alternatif -->
        <div class="mt-4 pt-4 border-t border-gray-200">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Atau Ketik NIS Secara Manual:</label>
            <div class="flex gap-2">
                <input type="text" id="manual-nis" placeholder="Masukkan NIS..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="kirimManual()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP ANDA
        // ==========================================
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxZtDi4uDpPSZqQLV14z9Y_eHDMN4WPAGJrM6CXOaUPdBeFXR1oRhDWzgC5TclvUGhfDQ/exec";

        let isProcessing = false;
        let html5QrCode = null;

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;
            console.log(`Scan berhasil: ${decodedText}`);
            kirimKeGoogleSheets(decodedText);
        }

        // Langkah 1: Memaksa browser meminta izin dan mencari daftar lensa
        function cariKamera() {
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    document.getElementById('init-container').classList.add('hidden');
                    const selectionContainer = document.getElementById('camera-selection-container');
                    selectionContainer.classList.remove('hidden');
                    
                    const select = document.getElementById('camera-select');
                    select.innerHTML = ""; 
                    
                    // Masukkan semua lensa yang ada di HP ke dalam pilihan dropdown
                    devices.forEach((device, index) => {
                        let option = document.createElement('option');
                        option.value = device.id;
                        option.text = device.label || `Lensa Kamera ${index + 1}`;
                        select.appendChild(option);
                    });
                    
                    // Pilih lensa terakhir sebagai default (biasanya lensa utama belakang di Android)
                    select.selectedIndex = devices.length - 1;

                } else {
                    alert("Tidak ada kamera yang terdeteksi di perangkat ini.");
                }
            }).catch(err => {
                console.error("Gagal mendapat daftar kamera:", err);
                alert("Browser memblokir kamera. Silakan cek ikon Gembok di atas dan Izinkan kamera!");
            });
        }

        // Langkah 2: Mulai kamera menggunakan ID Lensa yang dipilih di dropdown
        function mulaiKameraPilihan() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            } else if (html5QrCode.isScanning) {
                // Jika sedang nyala lalu mau ganti lensa, matikan dulu
                html5QrCode.stop().then(() => jalankanScanner()).catch(console.error);
                return;
            }
            jalankanScanner();
        }

        function jalankanScanner() {
            const cameraId = document.getElementById('camera-select').value;
            const config = { fps: 15, qrbox: { width: 250, height: 250 } };

            html5QrCode.start(
                cameraId, // Tembak langsung ID spesifik lensanya
                config,
                onScanSuccess
            ).then(() => {
                document.getElementById('reader').innerHTML = ""; 
            }).catch(err => {
                console.error("Gagal membuka kamera:", err);
                alert("Gagal membuka lensa ini (Mungkin lensa sensor). Silakan pilih lensa lain di daftar!");
            });
        }

        // Fungsi kirim data
        function kirimManual() {
            const inputVal = document.getElementById('manual-nis').value.trim();
            if (!inputVal) {
                alert("NIS tidak boleh kosong!");
                return;
            }
            if (isProcessing) return;
            isProcessing = true;
            document.getElementById('manual-nis').value = "";
            kirimKeGoogleSheets(inputVal);
        }

        function kirimKeGoogleSheets(nisOrData) {
            const resultDiv = document.getElementById('result-container');
            resultDiv.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-yellow-100', 'text-yellow-800', 'bg-red-100', 'text-red-800');
            resultDiv.className = "p-4 rounded-lg text-center font-medium mb-4 bg-blue-100 text-blue-800";
            resultDiv.innerHTML = "Mengirim data...";

            const targetUrl = `${URL_APPS_SCRIPT}?dataQR=${encodeURIComponent(nisOrData)}`;

            fetch(targetUrl)
                .then(response => response.text())
                .then(resText => {
                    if (resText.startsWith("SUKSES")) {
                        resultDiv.className = "p-4 rounded-lg text-center font-bold mb-4 bg-green-100 text-green-800";
                        resultDiv.innerHTML = resText.replace("SUKSES|", "BERHASIL: ");
                    } else if (resText.startsWith("DOUBLE")) {
                        resultDiv.className = "p-4 rounded-lg text-center font-bold mb-4 bg-yellow-100 text-yellow-800";
                        resultDiv.innerHTML = resText.replace("DOUBLE|", "PERHATIAN: ");
                    } else {
                        resultDiv.className = "p-4 rounded-lg text-center font-bold mb-4 bg-red-100 text-red-800";
                        resultDiv.innerHTML = resText.replace("ERROR|", "GAGAL: ");
                    }
                    setTimeout(() => { isProcessing = false; }, 2500);
                })
                .catch(err => {
                    resultDiv.className = "p-4 rounded-lg text-center font-bold mb-4 bg-red-100 text-red-800";
                    resultDiv.innerHTML = "Gagal terhubung ke server!";
                    isProcessing = false;
                });
        }
    </script>
</body>
</html>
