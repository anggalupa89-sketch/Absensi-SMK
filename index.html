<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Modern</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Library Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
    <style>
        .bg-gradient-purple { background: linear-gradient(135deg, #6b21a8 0%, #4c1d95 100%); }
        /* Mempercantik tombol bawaan dari library scanner */
        #reader button {
            background-color: #6b21a8; color: white; padding: 8px 16px; border-radius: 8px; margin-top: 10px; border: none; font-weight: bold; cursor: pointer;
        }
        #reader select {
            padding: 8px; border-radius: 8px; border: 1px solid #d8b4fe; margin-bottom: 10px; width: 100%;
        }
        #reader { border: none !important; }
    </style>
</head>
<body class="bg-purple-50 min-h-screen text-gray-800 flex flex-col items-center p-4">

    <!-- Header -->
    <div class="max-w-xl w-full bg-gradient-purple text-white rounded-2xl shadow-xl p-6 mb-6 text-center">
        <h1 class="text-3xl font-extrabold tracking-wide mb-1">ABSENSI SISWA</h1>
        <p class="text-purple-200 text-sm">Sistem Cepat & Anti-Error</p>
    </div>

    <div class="max-w-xl w-full space-y-6">
        
        <!-- Pilihan Status Absen -->
        <div class="bg-white rounded-2xl shadow-lg p-4">
            <label class="block text-xs font-bold text-purple-900 uppercase tracking-wider mb-2">Status Absen:</label>
            <div class="grid grid-cols-5 gap-2">
                <button type="button" onclick="setStatus('Auto')" id="btn-Auto" class="status-btn py-2 text-xs font-bold rounded-xl border-2 border-purple-600 bg-purple-600 text-white">Auto</button>
                <button type="button" onclick="setStatus('Datang')" id="btn-Datang" class="status-btn py-2 text-xs font-bold rounded-xl border-2 border-purple-200 text-purple-700">Datang</button>
                <button type="button" onclick="setStatus('Pulang')" id="btn-Pulang" class="status-btn py-2 text-xs font-bold rounded-xl border-2 border-purple-200 text-purple-700">Pulang</button>
                <button type="button" onclick="setStatus('Sakit')" id="btn-Sakit" class="status-btn py-2 text-xs font-bold rounded-xl border-2 border-purple-200 text-purple-700">Sakit</button>
                <button type="button" onclick="setStatus('Izin')" id="btn-Izin" class="status-btn py-2 text-xs font-bold rounded-xl border-2 border-purple-200 text-purple-700">Izin</button>
            </div>
        </div>

        <!-- ENGINE SCANNER ASLI BAWAAN LIBRARY (Pasti Jalan) -->
        <div class="bg-white rounded-2xl shadow-lg p-5">
            <h2 class="font-bold text-sm text-purple-900 mb-3 flex justify-between">
                <span>Kamera Scanner</span>
                <span id="scan-status-badge" class="px-2 py-0.5 bg-purple-100 text-purple-700 rounded-full text-xs">Mode: Auto</span>
            </h2>
            
            <!-- Tempat Scanner Bawaan akan dimunculkan -->
            <div id="reader" class="w-full rounded-xl overflow-hidden border-2 border-purple-100 bg-gray-50 p-2"></div>
        </div>

        <!-- Input Manual -->
        <div class="bg-white rounded-2xl shadow-lg p-5">
            <label class="block text-xs font-bold text-purple-900 uppercase mb-2">Ketik NIS Manual:</label>
            <div class="flex gap-2">
                <input type="text" id="manual-nis" placeholder="Ketik NIS..." class="flex-1 border-2 border-purple-100 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-purple-600">
                <button onclick="prosesManual()" class="bg-purple-600 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-md">Kirim</button>
            </div>
        </div>

        <!-- Notifikasi Hasil -->
        <div id="result-container" class="hidden p-4 rounded-2xl text-center font-bold text-sm shadow-md transition-all duration-300"></div>

        <!-- List Riwayat -->
        <div class="bg-white rounded-2xl shadow-lg p-5 mb-10">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-sm text-purple-900 uppercase">Daftar Masuk Hari Ini</h2>
                <span id="counter-hadir" class="bg-purple-100 text-purple-700 text-xs font-bold px-2 py-1 rounded-full">0 Siswa</span>
            </div>
            <div class="overflow-x-auto max-h-60 overflow-y-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-purple-50 text-purple-800 sticky top-0">
                        <tr>
                            <th class="p-2">Waktu</th>
                            <th class="p-2">Data Siswa</th>
                        </tr>
                    </thead>
                    <tbody id="list-absen-body" class="divide-y divide-purple-50">
                        <tr><td colspan="2" class="text-center text-gray-400 py-4">Belum ada data.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // GANTI URL DI BAWAH INI
        // ==========================================
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxZtDi4uDpPSZqQLV14z9Y_eHDMN4WPAGJrM6CXOaUPdBeFXR1oRhDWzgC5TclvUGhfDQ/exec";

        let currentStatus = "Auto";
        let isProcessing = false;
        let listSiswaHariIni = [];

        // Fungsi Ganti Status
        function setStatus(status) {
            currentStatus = status;
            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.className = "status-btn py-2 text-xs font-bold rounded-xl border-2 border-purple-200 text-purple-700 transition";
            });
            document.getElementById(`btn-${status}`).className = "status-btn py-2 text-xs font-bold rounded-xl border-2 border-purple-600 bg-purple-600 text-white transition";
            document.getElementById('scan-status-badge').innerText = `Mode: ${status}`;
        }

        // Fungsi yang dipanggil saat scanner berhasil membaca
        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;
            kirimKeGoogleSheets(decodedText);
        }

        // =======================================================
        // INISIALISASI SCANNER BAWAAN LIBRARY (ANTI-MACET)
        // =======================================================
        document.addEventListener("DOMContentLoaded", function () {
            // Menggunakan Html5QrcodeScanner (Sistem Otomatis dari pembuatnya)
            let html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { 
                    fps: 10, 
                    qrbox: {width: 250, height: 250},
                    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA, Html5QrcodeScanType.SCAN_TYPE_FILE]
                },
                false
            );
            
            // Render UI bawaannya
            html5QrcodeScanner.render(onScanSuccess);
        });
        // =======================================================

        function prosesManual() {
            const nis = document.getElementById('manual-nis').value.trim();
            if (!nis) return;
            if (isProcessing) return;
            isProcessing = true;
            document.getElementById('manual-nis').value = "";
            kirimKeGoogleSheets(nis);
        }

        document.getElementById('manual-nis').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') prosesManual();
        });

        function kirimKeGoogleSheets(nisOrData) {
            const resultDiv = document.getElementById('result-container');
            resultDiv.className = "p-4 rounded-2xl text-center font-bold text-sm shadow-md bg-purple-100 text-purple-800 block";
            resultDiv.innerHTML = "Memproses absensi... ⚡";

            let targetUrl = `${URL_APPS_SCRIPT}?dataQR=${encodeURIComponent(nisOrData)}`;
            if (currentStatus !== "Auto") targetUrl += `&status=${encodeURIComponent(currentStatus)}`;

            fetch(targetUrl)
                .then(res => res.text())
                .then(resText => {
                    let badgeColor = "bg-green-100 text-green-800";
                    let prefix = "BERHASIL: ";

                    if (resText.startsWith("DOUBLE")) { badgeColor = "bg-yellow-100 text-yellow-800"; prefix = "PERHATIAN: "; } 
                    else if (resText.startsWith("ERROR")) { badgeColor = "bg-red-100 text-red-800"; prefix = "GAGAL: "; }

                    resultDiv.className = `p-4 rounded-2xl text-center font-bold text-sm shadow-md ${badgeColor} block`;
                    resultDiv.innerHTML = resText.replace("SUKSES|", prefix).replace("DOUBLE|", prefix).replace("ERROR|", prefix);

                    if (resText.startsWith("SUKSES")) tambahKeListRiwayat(resText);

                    setTimeout(() => { resultDiv.classList.add('hidden'); isProcessing = false; }, 2000);
                })
                .catch(err => {
                    resultDiv.className = "p-4 rounded-2xl text-center font-bold text-sm shadow-md bg-red-100 text-red-800 block";
                    resultDiv.innerHTML = "Gagal terhubung!";
                    setTimeout(() => { resultDiv.classList.add('hidden'); isProcessing = false; }, 2000);
                });
        }

        function tambahKeListRiwayat(responseFromServer) {
            const waktu = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            listSiswaHariIni.unshift({ waktu: waktu, pesan: responseFromServer.replace("SUKSES|", "") });
            
            const tbody = document.getElementById('list-absen-body');
            document.getElementById('counter-hadir').innerText = `${listSiswaHariIni.length} Siswa`;
            
            let html = "";
            listSiswaHariIni.forEach(item => {
                html += `<tr class="border-b border-purple-50"><td class="p-2 font-medium text-purple-900">${item.waktu}</td><td class="p-2 font-bold text-gray-800">${item.pesan}</td></tr>`;
            });
            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
