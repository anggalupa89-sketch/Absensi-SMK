<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi QR Code</title>
    <!-- Tailwind CSS untuk tampilan rapi dan modern -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Pustaka Scanner QR -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6">
        <htext class="text-2xl font-bold text-center text-gray-800 mb-2">Absensi Siswa</htext>
        <p class="text-sm text-center text-gray-500 mb-6">Arahkan kamera ke QR Code / Barcode siswa</p>

        <!-- Area Kamera Scanner -->
        <div id="reader" class="w-full rounded-lg overflow-hidden border-2 border-dashed border-gray-300 mb-4"></div>

        <!-- Status Hasil Scan -->
        <div id="result-container" class="hidden p-4 rounded-lg text-center font-medium mb-4"></div>

        <!-- Input Manual (Opsional jika kamera bermasalah) -->
        <div class="mt-4 pt-4 border-t border-gray-200">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Atau Ketik NIS Secara Manual:</label>
            <div class="flex gap-2">
                <input type="text" id="manual-nis" placeholder="Masukkan NIS..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="kirimManual()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP TERBARU ANDA
        // ==========================================
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxZtDi4uDpPSZqQLV14z9Y_eHDMN4WPAGJrM6CXOaUPdBeFXR1oRhDWzgC5TclvUGhfDQ/exec";

        let isProcessing = false;
        let html5QrCode;

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;
            console.log(`Scan berhasil: ${decodedText}`);
            kirimKeGoogleSheets(decodedText);
        }

        function kirimManual() {
            const inputVal = document.getElementById('manual-nis').value.trim();
            if (!inputVal) {
                alert("NIS tidak boleh kosong!");
                return;
            }
            if (isProcessing) return;
            isProcessing = true;
            document.getElementById('manual-nis').value = "";
            kirimKeGoogleSheets(inputVal);
        }

        function kirimKeGoogleSheets(nisOrData) {
            const resultDiv = document.getElementById('result-container');
            resultDiv.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-yellow-100', 'text-yellow-800', 'bg-red-100', 'text-red-800');
            resultDiv.className = "p-4 rounded-lg text-center font-medium mb-4 bg-blue-100 text-blue-800";
            resultDiv.innerHTML = "Mengirim data...";

            const targetUrl = `${URL_APPS_SCRIPT}?dataQR=${encodeURIComponent(nisOrData)}`;

            fetch(targetUrl)
                .then(response => response.text())
                .then(resText => {
                    console.log("Respon dari Sheets:", resText);
                    
                    if (resText.startsWith("SUKSES")) {
                        resultDiv.className = "p-4 rounded-lg text-center font-bold mb-4 bg-green-100 text-green-800";
                        resultDiv.innerHTML = resText.replace("SUKSES|", "BERHASIL: ");
                    } else if (resText.startsWith("DOUBLE")) {
                        resultDiv.className = "p-4 rounded-lg text-center font-bold mb-4 bg-yellow-100 text-yellow-800";
                        resultDiv.innerHTML = resText.replace("DOUBLE|", "PERHATIAN: ");
                    } else {
                        resultDiv.className = "p-4 rounded-lg text-center font-bold mb-4 bg-red-100 text-red-800";
                        resultDiv.innerHTML = resText.replace("ERROR|", "GAGAL: ");
                    }

                    setTimeout(() => {
                        isProcessing = false;
                    }, 3000);
                })
                .catch(err => {
                    console.error("Fetch Error:", err);
                    resultDiv.className = "p-4 rounded-lg text-center font-bold mb-4 bg-red-100 text-red-800";
                    resultDiv.innerHTML = "Gagal terhubung ke server!";
                    isProcessing = false;
                });
        }

        // Deteksi dan Pilih Kamera secara Pintar
        document.addEventListener("DOMContentLoaded", function () {
            html5QrCode = new Html5Qrcode("reader");
            
            // Cari daftar kamera yang tersedia di HP
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    // Cari kamera belakang (biasanya berlabel "back", "rear", atau ambil kamera terakhir/utama)
                    let selectedCameraId = devices[0].id;
                    
                    for (let i = 0; i < devices.length; i++) {
                        let label = devices[i].label.toLowerCase();
                        if (label.includes("back") || label.includes("rear") || label.includes("belakang") || label.includes("utama")) {
                            selectedCameraId = devices[i].id;
                            break;
                        }
                    }

                    // Mulai scanner menggunakan kamera yang terpilih
                    html5QrCode.start(
                        selectedCameraId,
                        { fps: 10, qrbox: { width: 250, height: 250 } },
                        onScanSuccess
                    ).catch(err => {
                        console.error("Gagal menyalakan kamera pilihan:", err);
                        fallbackKameraUtama();
                    });
                } else {
                    alert("Tidak ada kamera yang terdeteksi di perangkat ini.");
                }
            }).catch(err => {
                console.error("Error mendeteksi kamera:", err);
                fallbackKameraUtama();
            });
        });

        // Cadangan jika pendeteksian spesifik gagal
        function fallbackKameraUtama() {
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                alert("Tidak dapat mengakses kamera. Pastikan izin kamera di browser sudah diaktifkan.");
            });
        }
    </script>
