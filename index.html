<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi QR Code</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Absensi Siswa</h1>
        <p class="text-sm text-center text-gray-500 mb-4">Arahkan kamera atau pilih opsi di bawah</p>

        <!-- Area Kamera Scanner -->
        <div id="reader" class="w-full rounded-lg overflow-hidden border-2 border-dashed border-gray-300 mb-3 bg-black flex items-center justify-center text-white text-sm" style="min-height: 250px;">
            Menyiapkan Kamera...
        </div>

        <!-- Pilihan Kamera (Dropdown jika kamera lebih dari satu) -->
        <div id="camera-selection-container" class="mb-4 hidden">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Pilih Kamera:</label>
            <select id="camera-select" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </select>
        </div>

        <!-- Status Hasil Scan -->
        <div id="result-container" class="hidden p-4 rounded-lg text-center font-medium mb-4"></div>

        <!-- Alternatif: Upload File Gambar Barcode / QR Code dari HP -->
        <div class="mb-4 p-3 bg-gray-50 rounded-lg border border-gray-200">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Atau Upload Gambar Barcode dari Galeri:</label>
            <input type="file" id="qr-input-file" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <!-- Input Manual NIS -->
        <div class="pt-3 border-t border-gray-200">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Atau Ketik NIS Secara Manual:</label>
            <div class="flex gap-2">
                <input type="text" id="manual-nis" placeholder="Masukkan NIS..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="kirimManual()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP TERBARU ANDA
        // ==========================================
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxZtDi4uDpPSZqQLV14z9Y_eHDMN4WPAGJrM6CXOaUPdBeFXR1oRhDWzgC5TclvUGhfDQ/exec";

        let isProcessing = false;
        let html5QrCode;

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;
            console.log(`Scan berhasil: ${decodedText}`);
            kirimKeGoogleSheets(decodedText);
        }

        function kirimManual() {
            const inputVal = document.getElementById('manual-nis').value.trim();
            if (!inputVal) {
                alert("NIS tidak boleh kosong!");
                return;
            }
            if (isProcessing) return;
            isProcessing = true;
            document.getElementById('manual-nis').value = "";
            kirimKeGoogleSheets(inputVal);
        }

        function kirimKeGoogleSheets(nisOrData) {
            const resultDiv = document.getElementById('result-container');
            resultDiv.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-yellow-100', 'text-yellow-800', 'bg-red-100', 'text-red-800');
            resultDiv.className = "p-4 rounded-lg text-center font-medium mb-4 bg-blue-100 text-blue-800";
            resultDiv.innerHTML = "Mengirim data...";

            const targetUrl = `${URL_APPS_SCRIPT}?dataQR=${encodeURIComponent(nisOrData)}`;

            fetch(targetUrl)
                .then(response => response.text())
                .then(resText => {
                    console.log("Respon dari Sheets:", resText);
                    
                    if (resText.startsWith("SUKSES")) {
                        resultDiv.className = "p-4 rounded-lg text-center font-bold mb-4 bg-green-100 text-green-800";
                        resultDiv.innerHTML = resText.replace("SUKSES|", "BERHASIL: ");
                    } else if (resText.startsWith("DOUBLE")) {
                        resultDiv.className = "p-4 rounded-lg text-center font-bold mb-4 bg-yellow-100 text-yellow-800";
                        resultDiv.innerHTML = resText.replace("DOUBLE|", "PERHATIAN: ");
                    } else {
                        resultDiv.className = "p-4 rounded-lg text-center font-bold mb-4 bg-red-100 text-red-800";
                        resultDiv.innerHTML = resText.replace("ERROR|", "GAGAL: ");
                    }

                    setTimeout(() => {
                        isProcessing = false;
                    }, 3000);
                })
                .catch(err => {
                    console.error("Fetch Error:", err);
                    resultDiv.className = "p-4 rounded-lg text-center font-bold mb-4 bg-red-100 text-red-800";
                    resultDiv.innerHTML = "Gagal terhubung ke server!";
                    isProcessing = false;
                });
        }

        // Inisialisasi Kamera & Fitur Upload File
        document.addEventListener("DOMContentLoaded", function () {
            html5QrCode = new Html5Qrcode("reader");

            // 1. Fitur Scan lewat Upload File Gambar (Sangat aman jika kamera error)
            const fileInput = document.getElementById('qr-input-file');
            fileInput.addEventListener('change', e => {
                if (e.target.files.length == 0) return;
                const imageFile = e.target.files[0];
                html5QrCode.scanFile(imageFile, true)
                    .then(decodedText => {
                        onScanSuccess(decodedText);
                    })
                    .catch(err => {
                        alert("Gagal membaca barcode dari gambar tersebut. Pastikan foto jelas!");
                    });
            });

            // 2. Deteksi Kamera Otomatis
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    let containerSelect = document.getElementById('camera-selection-container');
                    let selectTag = document.getElementById('camera-select');
                    
                    if (devices.length > 1) {
                        containerSelect.classList.remove('hidden');
                        devices.forEach(device => {
                            let option = document.createElement('option');
                            option.value = device.id;
                            option.text = device.label || `Kamera ${selectTag.length + 1}`;
                            selectTag.appendChild(option);
                        });

                        selectTag.addEventListener('change', function() {
                            let selectedId = this.value;
                            html5QrCode.stop().then(() => {
                                mulaiKamera(selectedId);
                            }).catch(err => console.log(err));
                        });
                    }

                    // Pilih kamera belakang pertama atau kamera default
                    let defaultCamId = devices[devices.length - 1].id;
                    mulaiKamera(defaultCamId);
                } else {
                    document.getElementById('reader').innerHTML = "Tidak ada kamera terdeteksi.<br>Gunakan fitur ketik manual di bawah.";
                }
            }).catch(err => {
                console.error("Izin kamera ditolak / error:", err);
                document.getElementById('reader').innerHTML = "Akses kamera diblokir browser.<br>Silakan aktifkan izin kamera atau gunakan input manual.";
            });
        });

        function mulaiKamera(cameraId) {
            html5QrCode.start(
                cameraId,
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                console.error("Gagal start kamera:", err);
                document.getElementById('reader').innerHTML = "Gagal membuka kamera.<br>Silakan gunakan ketik manual.";
            });
        }
    </script>
</body>
</html>
