<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Smart School</title>
    <!-- Library untuk Scanner QR/Barcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary-purple: #6a0dad;
            --light-purple: #f3e5f5;
        }
        body {
            background-color: var(--light-purple);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        .header {
            background-color: var(--primary-purple); 
            color: white;
            width: 100%; 
            text-align: center; 
            padding: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        .container {
            background: white; 
            padding: 15px; 
            border-radius: 10px;
            margin-top: 15px; 
            border: 2px solid var(--primary-purple);
            width: 90%; 
            max-width: 400px; 
            text-align: center;
            box-shadow: 0 5px 15px rgba(106, 13, 173, 0.2);
        }
        .radio-group { 
            margin-bottom: 15px; 
            background: #ede7f6;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed var(--primary-purple);
        }
        .radio-group label { 
            margin: 0 8px; 
            font-weight: bold; 
            color: var(--primary-purple);
            cursor: pointer;
            font-size: 15px;
        }
        #reader {
            width: 100%;
        }
        #result { 
            display: none; 
            margin-top: 10px; 
            padding: 12px; 
            border-radius: 5px; 
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Absensi Kilat Digital</h2>
        <p>10 PS | 10 TKJ A | 10 TKJ B & Guru</p>
    </div>

    <div class="container">
        <!-- Pilihan Datang atau Pulang -->
        <div class="radio-group">
            <input type="radio" id="datang" name="status" value="Datang" checked>
            <label for="datang">🟢 Masuk</label>
            
            <input type="radio" id="pulang" name="status" value="Pulang">
            <label for="pulang">🟣 Pulang</label>
        </div>

        <!-- Area Kamera Scanner -->
        <div id="reader"></div>
        
        <!-- Area Notifikasi Hasil -->
        <div id="result">Siap memindai...</div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE SCRIPT ANDA
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw9vUXOdGPFUbtkgO-mkAXWhU-Nl_eM2i1xFnULCvfxVyws_m4mxaBUr0DycBHdOpxUFQ/exec';
        
        let isProcessing = false;
        let audioCtx = null;

        // Inisialisasi Audio saat layar pertama kali disentuh (mengatasi blokir browser)
        document.body.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }, { once: true });

        function playBeep(type) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                if (type === 'datang') {
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // Tinggi (Cepat)
                } else if (type === 'pulang') {
                    oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // Sedang
                } else {
                    oscillator.frequency.setValueAtTime(220, audioCtx.currentTime); // Rendah (Error)
                }
                
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1); // Durasi dipercepat jadi 0.1 detik
            } catch(e) {
                console.log("Audio error");
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return; 
            isProcessing = true;

            const statusAbsen = document.querySelector('input[name="status"]:checked').value;
            const resultBox = document.getElementById('result');
            
            resultBox.style.display = "block";
            resultBox.style.backgroundColor = "#d1c4e9";
            resultBox.style.color = "#311b92";
            resultBox.innerText = "⏳ Menyimpan...";

            const formData = new URLSearchParams();
            formData.append('dataQR', decodedText);
            formData.append('status', statusAbsen);

            // Kirim data ke Google Sheets secara background
            fetch(scriptURL, { method: 'POST', body: formData})
                .then(response => response.text())
                .then(result => {
                    let responseSplit = result.split("|");
                    let statusRes = responseSplit[0];
                    let pesanRes = responseSplit[1];

                    if (statusRes === "DOUBLE") {
                        playBeep('error');
                        resultBox.style.backgroundColor = "#ff9800"; // Oranye
                        resultBox.style.color = "white";
                        resultBox.innerText = "⚠️ " + pesanRes;
                    } else if (statusRes === "SUKSES") {
                        if (statusAbsen === "Datang") {
                            playBeep('datang');
                        } else {
                            playBeep('pulang');
                        }
                        resultBox.style.backgroundColor = "#4caf50"; // Hijau
                        resultBox.style.color = "white";
                        resultBox.innerText = "✅ " + pesanRes;
                    } else {
                        playBeep('datang');
                        resultBox.style.backgroundColor = "#2196f3";
                        resultBox.style.color = "white";
                        resultBox.innerText = result;
                    }

                    // DIKEBUT: Jeda dipercepat menjadi HANYA 1.5 DETIK agar siswa berikutnya bisa langsung scan!
                    setTimeout(() => { 
                        resultBox.style.display = "none";
                        isProcessing = false; 
                    }, 1500);
                })
                .catch(error => {
                    playBeep('error');
                    resultBox.style.backgroundColor = "#f44336"; // Merah
                    resultBox.style.color = "white";
                    resultBox.innerText = "❌ Gagal koneksi!";
                    
                    setTimeout(() => { 
                        resultBox.style.display = "none";
                        isProcessing = false; 
                    }, 1500);
                });
        }

        // DIKEBUT: FPS dinaikkan ke 25 agar kamera jauh lebih responsif menangkap barcode
        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 25, 
            qrbox: {width: 230, height: 230} 
        }, false);
        
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
