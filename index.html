<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Smart School</title>
    <!-- Library untuk Scanner QR/Barcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary-purple: #6a0dad;
            --light-purple: #f3e5f5;
            --accent-purple: #9c27b0;
        }
        body {
            background-color: var(--light-purple);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        .header {
            background-color: var(--primary-purple); 
            color: white;
            width: 100%; 
            text-align: center; 
            padding: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        .container {
            background: white; 
            padding: 20px; 
            border-radius: 10px;
            margin-top: 20px; 
            border: 2px solid var(--primary-purple);
            width: 90%; 
            max-width: 400px; 
            text-align: center;
            box-shadow: 0 5px 15px rgba(106, 13, 173, 0.2);
        }
        .radio-group { 
            margin-bottom: 20px; 
            background: #ede7f6;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed var(--primary-purple);
        }
        .radio-group label { 
            margin: 0 10px; 
            font-weight: bold; 
            color: var(--primary-purple);
            cursor: pointer;
            font-size: 16px;
        }
        #reader {
            width: 100%;
        }
        #result { 
            display: none; 
            margin-top: 15px; 
            padding: 15px; 
            border-radius: 5px; 
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Absensi Sekolah Digital</h2>
        <p>10 PS | 10 TKJ A | 10 TKJ B & Guru</p>
    </div>

    <div class="container">
        <h3 style="color: var(--primary-purple); margin-top: 0;">Pilih Status Absen:</h3>
        
        <!-- Pilihan Datang atau Pulang -->
        <div class="radio-group">
            <input type="radio" id="datang" name="status" value="Datang" checked>
            <label for="datang">🟢 Masuk (Datang)</label>
            
            <input type="radio" id="pulang" name="status" value="Pulang">
            <label for="pulang">🟣 Pulang</label>
        </div>

        <!-- Area Kamera Scanner -->
        <div id="reader"></div>
        
        <!-- Area Notifikasi Hasil -->
        <div id="result">Hasil scan akan muncul di sini...</div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE SCRIPT ANDA
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw9vUXOdGPFUbtkgO-mkAXWhU-Nl_eM2i1xFnULCvfxVyws_m4mxaBUr0DycBHdOpxUFQ/exec';
        
        let isProcessing = false;

        // Fungsi pembuat suara Beep otomatis (Tanpa file eksternal)
        function playBeep(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                if (type === 'datang') {
                    oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // Suara beep nada tinggi
                } else if (type === 'pulang') {
                    oscillator.frequency.setValueAtTime(400, audioCtx.currentTime); // Suara beep nada rendah
                } else {
                    oscillator.frequency.setValueAtTime(200, audioCtx.currentTime); // Suara error (rendah banget)
                }
                
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15); // Durasi bunyi 0.15 detik
            } catch(e) {
                console.log("Audio tidak didukung browser");
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // PROTEKSI ANTI-SCAN BERULANG (Jeda 4 detik agar tidak tidak sengaja scan dobel)
            if (isProcessing) return; 
            isProcessing = true;

            const statusAbsen = document.querySelector('input[name="status"]:checked').value;
            const resultBox = document.getElementById('result');
            
            resultBox.style.display = "block";
            resultBox.style.backgroundColor = "#d1c4e9";
            resultBox.style.color = "#311b92";
            resultBox.innerText = "⏳ Memproses data...";

            const formData = new URLSearchParams();
            formData.append('dataQR', decodedText);
            formData.append('status', statusAbsen);

            fetch(scriptURL, { method: 'POST', body: formData})
                .then(response => response.text())
                .then(result => {
                    let responseSplit = result.split("|");
                    let statusRes = responseSplit[0];
                    let pesanRes = responseSplit[1];

                    if (statusRes === "DOUBLE") {
                        playBeep('error'); // Suara peringatan
                        resultBox.style.backgroundColor = "#ff9800"; // Oranye
                        resultBox.style.color = "white";
                        resultBox.innerText = "⚠️ " + pesanRes;
                    } else if (statusRes === "SUKSES") {
                        // Membedakan suara beep berdasarkan jenis absen (Datang / Pulang)
                        if (statusAbsen === "Datang") {
                            playBeep('datang');
                        } else {
                            playBeep('pulang');
                        }

                        resultBox.style.backgroundColor = "#4caf50"; // Hijau
                        resultBox.style.color = "white";
                        resultBox.innerText = "✅ " + pesanRes;
                    } else {
                        playBeep('datang');
                        resultBox.style.backgroundColor = "#2196f3";
                        resultBox.style.color = "white";
                        resultBox.innerText = result;
                    }

                    // Jeda waktu 4 detik sebelum kamera bisa scan barcode berikutnya (Mencegah scan tidak sengaja)
                    setTimeout(() => { 
                        resultBox.style.display = "none";
                        isProcessing = false; 
                    }, 4000);
                })
                .catch(error => {
                    playBeep('error');
                    resultBox.style.backgroundColor = "#f44336"; // Merah
                    resultBox.style.color = "white";
                    resultBox.innerText = "❌ Gagal terhubung ke server!";
                    
                    setTimeout(() => { 
                        resultBox.style.display = "none";
                        isProcessing = false; 
                    }, 4000);
                });
        }

        // Inisialisasi Kamera Scanner
        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, 
            qrbox: {width: 250, height: 250} 
        }, false);
        
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
