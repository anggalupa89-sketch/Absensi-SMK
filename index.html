<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Smart School</title>
    <!-- Library untuk Scanner QR/Barcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary-purple: #6a0dad;
            --light-purple: #f3e5f5;
            --accent-purple: #9c27b0;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
        }
        body {
            background-color: var(--light-purple);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            padding-bottom: 30px;
        }
        .header {
            background-color: var(--primary-purple); 
            color: white;
            width: 100%; 
            text-align: center; 
            padding: 12px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .header p { margin: 3px 0 0 0; font-size: 13px; }
        
        .container {
            background: white; 
            padding: 15px; 
            border-radius: 10px;
            border: 2px solid var(--primary-purple);
            width: 90%; 
            max-width: 450px; 
            text-align: center;
            box-shadow: 0 5px 15px rgba(106, 13, 173, 0.2);
            margin-bottom: 15px;
        }
        
        .radio-group { 
            margin-bottom: 15px; 
            background: #ede7f6;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed var(--primary-purple);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .radio-group label { 
            font-weight: bold; 
            color: var(--primary-purple);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        #reader { width: 100%; margin-bottom: 5px; }
        
        #result { 
            display: none; 
            margin-top: 10px; 
            padding: 10px; 
            border-radius: 8px; 
            font-weight: bold;
            font-size: 14px;
        }

        .manual-input {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 8px;
        }
        .manual-input input {
            flex: 1;
            padding: 8px;
            border: 1px solid #b39ddb;
            border-radius: 5px;
            font-size: 13px;
            outline: none;
        }
        .manual-input input:focus { border-color: var(--primary-purple); }
        .manual-input button {
            background-color: var(--primary-purple);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .manual-input button:hover { background-color: var(--accent-purple); }

        .history-container {
            width: 90%;
            max-width: 450px;
            background: white;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .history-container h3 { margin-top: 0; color: var(--primary-purple); font-size: 15px; border-bottom: 2px solid var(--light-purple); padding-bottom: 6px; }
        .history-list {
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            font-size: 13px;
        }
        .history-item {
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
        }
        .history-time { color: #888; font-size: 11px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Absensi Sekolah Digital</h2>
        <p>10 PS | 10 TKJ A | 10 TKJ B & Guru</p>
    </div>

    <div class="container">
        <h3 style="color: var(--primary-purple); margin-top: 0; font-size: 15px;">Pilih Status Kehadiran:</h3>
        
        <div class="radio-group">
            <label><input type="radio" name="status" value="Datang" checked> 🟢 Datang</label>
            <label><input type="radio" name="status" value="Pulang"> 🔴 Pulang</label>
            <label><input type="radio" name="status" value="Sakit"> 🟡 Sakit</label>
            <label><input type="radio" name="status" value="Izin"> 🔵 Izin</label>
        </div>

        <div id="reader"></div>
        
        <div id="result">Hasil scan akan muncul di sini...</div>

        <div class="manual-input">
            <input type="text" id="input-manual" placeholder="Ketik NIS Manual...">
            <button onclick="kirimManual()">Absen</button>
        </div>
    </div>

    <div class="history-container">
        <h3>Riwayat Masuk Hari Ini</h3>
        <div class="history-list" id="riwayat-list">
            <div class="history-item" style="justify-content: center; color: #aaa;">Belum ada data...</div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxijFYdibuhL0D8T16511Wvpb_nKaOFaoeokoh-HvQxIZCiCL9d0JAHbzbgsQ9-J1CHxw/exec/exec';
        let isProcessing = false;

        function playBeep(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.setValueAtTime(type === 'datang' ? 800 : 400, audioCtx.currentTime); 
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1); 
            } catch(e) {}
        }

        function kirimManual() {
            const nis = document.getElementById('input-manual').value;
            const nisBersih = nis.trim().replace(/\s+/g, '');
            if(!nisBersih) { alert("NIS tidak boleh kosong!"); return; }
            document.getElementById('input-manual').value = ""; 
            prosesKeSheets(nisBersih);
        }

        document.getElementById('input-manual').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') kirimManual();
        });

        // SCANNER CEPAT DENGAN PEMOTONG 7 DIGIT OTOMATIS
        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return; 
            
            let teksBersih = decodedText.trim().replace(/\s+/g, '');
            
            // Otomatis ambil 7 digit pertama (NIS) jika terbaca barcode gabungan
            if (teksBersih.length >= 7) {
                teksBersih = teksBersih.substring(0, 7);
            }

            prosesKeSheets(teksBersih);
        }

        function prosesKeSheets(dataTeks) {
            isProcessing = true;
            const statusAbsen = document.querySelector('input[name="status"]:checked').value;
            const resultBox = document.getElementById('result');
            
            resultBox.style.display = "block";
            resultBox.style.backgroundColor = "#d1c4e9";
            resultBox.style.color = "#311b92";
            resultBox.innerText = "⏳ Memproses...";

            const targetUrl = `${scriptURL}?dataQR=${encodeURIComponent(dataTeks)}&status=${encodeURIComponent(statusAbsen)}`;

            fetch(targetUrl)
                .then(response => response.text())
                .then(result => {
                    let responseSplit = result.split("|");
                    let statusRes = responseSplit[0];
                    let pesanRes = responseSplit[1] || result; 

                    if (statusRes === "DOUBLE") {
                        playBeep('error'); 
                        resultBox.style.backgroundColor = "var(--warning)"; 
                        resultBox.style.color = "white";
                        resultBox.innerText = "⚠️ " + pesanRes;
                    } else if (statusRes === "SUKSES") {
                        playBeep('datang');
                        resultBox.style.backgroundColor = "var(--success)"; 
                        resultBox.style.color = "white";
                        resultBox.innerText = "✅ " + pesanRes;
                        tambahKeRiwayat(pesanRes, statusAbsen);
                    } else {
                        playBeep('error');
                        resultBox.style.backgroundColor = "var(--danger)";
                        resultBox.style.color = "white";
                        resultBox.innerText = "❌ " + (pesanRes || result);
                    }

                    setTimeout(() => { 
                        resultBox.style.display = "none";
                        isProcessing = false; 
                    }, 1200);
                })
                .catch(error => {
                    playBeep('error');
                    resultBox.style.backgroundColor = "var(--danger)"; 
                    resultBox.style.color = "white";
                    resultBox.innerText = "❌ Gagal koneksi!";
                    setTimeout(() => { 
                        resultBox.style.display = "none";
                        isProcessing = false; 
                    }, 1200);
                });
        }

        function tambahKeRiwayat(pesan, status) {
            const listContainer = document.getElementById('riwayat-list');
            if(listContainer.innerHTML.includes("Belum ada data")) { listContainer.innerHTML = ""; }
            const waktu = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `<div><strong>${pesan}</strong></div><div class="history-time">${waktu}</div>`;
            listContainer.prepend(div);
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 15,
            rememberLastUsedCamera: true
        }, false);
        
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
